/* ═════════════ TOKENS ═════════════ */
:root{
  --bg:#f6f5f2; --bg-glow:rgba(212,87,42,.10); --surface:#ffffff; --surface-2:#f2f0eb; --surface-3:#e9e6df;
  --line:#e5e1d8; --line-strong:#d4cfc3;
  --text:#1b1a17; --text-2:#5d5950; --text-3:#8e897e;
  --accent:#d4572a; --accent-ink:#ffffff; --accent-soft:#fbe9e1; --accent-line:#f2c7b5;
  --urgent:#dc3f35; --urgent-soft:#fde8e6; --urgent-line:#f6c3be;
  --week:#5b4ff0; --week-soft:#ecebfe; --week-line:#cfcbfb;
  --ok:#1a9a68; --ok-soft:#e1f5ec; --warn:#c98a10; --warn-soft:#fbf1da; --low:#2f8fbf; --low-soft:#e2f1f9;
  --shadow-sm:0 1px 2px rgba(27,26,23,.06),0 1px 1px rgba(27,26,23,.04);
  --shadow:0 1px 2px rgba(27,26,23,.05),0 6px 18px -6px rgba(27,26,23,.10);
  --shadow-lg:0 24px 60px -18px rgba(27,26,23,.28),0 8px 20px -10px rgba(27,26,23,.12);
  --r-sm:8px; --r:14px; --r-lg:20px;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
  --sidebar:252px; --ease:cubic-bezier(.2,.8,.2,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141311; --bg-glow:rgba(240,116,63,.10); --surface:#1c1b18; --surface-2:#24221f; --surface-3:#2d2a26;
    --line:#2f2c28; --line-strong:#3d3a34;
    --text:#f3f0ea; --text-2:#bcb5aa; --text-3:#8a8478;
    --accent:#f0743f; --accent-ink:#1b120c; --accent-soft:#3a2219; --accent-line:#5d3322;
    --urgent:#f2675c; --urgent-soft:#3a1d1a; --urgent-line:#5e2a25;
    --week:#8f86ff; --week-soft:#25223f; --week-line:#3c3770;
    --ok:#3cc28d; --ok-soft:#173327; --warn:#e7b04a; --warn-soft:#3a2f17; --low:#5fb6e3; --low-soft:#16303d;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px -8px rgba(0,0,0,.55);
    --shadow-lg:0 24px 60px -16px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141311; --bg-glow:rgba(240,116,63,.10); --surface:#1c1b18; --surface-2:#24221f; --surface-3:#2d2a26;
  --line:#2f2c28; --line-strong:#3d3a34;
  --text:#f3f0ea; --text-2:#bcb5aa; --text-3:#8a8478;
  --accent:#f0743f; --accent-ink:#1b120c; --accent-soft:#3a2219; --accent-line:#5d3322;
  --urgent:#f2675c; --urgent-soft:#3a1d1a; --urgent-line:#5e2a25;
  --week:#8f86ff; --week-soft:#25223f; --week-line:#3c3770;
  --ok:#3cc28d; --ok-soft:#173327; --warn:#e7b04a; --warn-soft:#3a2f17; --low:#5fb6e3; --low-soft:#16303d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px -8px rgba(0,0,0,.55);
  --shadow-lg:0 24px 60px -16px rgba(0,0,0,.7); color-scheme:dark;
}

/* ═════════════ BASE ═════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.fill{fill:currentColor;stroke:none}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ═════════════ LOGIN ═════════════ */
#login{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:
  radial-gradient(60% 50% at 20% 10%,var(--bg-glow),transparent 70%),radial-gradient(50% 40% at 90% 90%,rgba(91,79,240,.10),transparent 70%),var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:40px 32px;text-align:center;box-shadow:var(--shadow-lg);animation:rise .5s var(--ease)}
.brand-mark{width:52px;height:52px;border-radius:16px;margin:0 auto 18px;background:linear-gradient(135deg,var(--accent),#e88a3c);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px -8px rgba(212,87,42,.6)}
.brand-mark .i{width:26px;height:26px;stroke-width:2.2}
.login-card h1{font-family:var(--display);font-size:2rem;letter-spacing:-.02em;margin-bottom:6px}
.login-card p{color:var(--text-2);margin-bottom:28px}
.google-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 18px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s}
.google-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--text-3)}
.google-btn svg{width:20px;height:20px}
.login-status{margin-top:14px;font-size:.82rem;color:var(--text-3);min-height:1.2em}

/* ═════════════ SHELL ═════════════ */
#app{display:none;min-height:100vh}
#app.ready{display:block}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .brand-mark{width:34px;height:34px;border-radius:11px;margin:0;box-shadow:0 6px 14px -6px rgba(212,87,42,.6)}
.brand .brand-mark .i{width:18px;height:18px}
.brand b{font-family:var(--display);font-size:1.3rem;letter-spacing:-.02em}
.nav-scroll{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin}
.nav-label{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:16px 10px 6px;display:flex;align-items:center;justify-content:space-between}
.nav-label button{color:var(--text-3);padding:3px;border-radius:6px;display:grid;place-items:center}
.nav-label button:hover{color:var(--accent);background:var(--accent-soft)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--text-2);font-weight:600;font-size:.92rem;transition:background .15s,color .15s;position:relative}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item .emo{width:22px;text-align:center;font-size:1rem;flex-shrink:0}
.nav-item .count{margin-left:auto;font-size:.72rem;font-weight:800;color:var(--text-3);background:var(--surface-2);padding:1px 7px;border-radius:20px;min-width:22px;text-align:center}
.nav-item.active .count{background:var(--surface);color:var(--accent)}
.nav-item .count.hot{background:var(--urgent);color:#fff}
.nav-item .nav-edit{margin-left:auto;opacity:0;color:var(--text-3);padding:2px;border-radius:6px;display:grid;place-items:center}
.nav-item:hover .nav-edit{opacity:1}
.nav-item:hover .nav-edit + .count{display:none}
.nav-item .nav-edit:hover{color:var(--accent)}
.side-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.user-row{display:flex;align-items:center;gap:10px;padding:4px 6px}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-3);flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--text-2);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-row .who{flex:1;min-width:0}
.user-row .who b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-row .who small{font-size:.74rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.sync{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;font-weight:700;color:var(--text-3);padding:6px 10px;border-radius:20px;background:var(--surface-2);white-space:nowrap}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.sync.synced{color:var(--ok)} .sync.synced .dot{background:var(--ok)}
.sync.syncing{color:var(--warn)} .sync.syncing .dot{background:var(--warn);animation:pulse 1s infinite}
.sync.offline{color:var(--text-2)} .sync.offline .dot{background:var(--text-3)}
.sync.error{color:var(--urgent)} .sync.error .dot{background:var(--urgent)}
.sync.local{color:var(--week)} .sync.local .dot{background:var(--week)}

.ibtn{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--text-2);transition:background .15s,color .15s,transform .15s;position:relative;flex-shrink:0}
.ibtn:hover{background:var(--surface-2);color:var(--text)}
.ibtn:active{transform:scale(.92)}
.ibtn-danger:hover{background:var(--urgent-soft);color:var(--urgent)}
.ibtn-accent:hover{background:var(--accent-soft);color:var(--accent)}
.badge-dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:10px;background:var(--urgent);color:#fff;font-size:.62rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}

.main{margin-left:var(--sidebar);min-height:100vh}
.topbar{display:none}
.view{max-width:1360px;margin:0 auto;padding:28px 32px 80px;animation:viewIn .32s var(--ease)}
.desk-tools{position:fixed;top:42px;right:max(48px,calc((100vw - var(--sidebar) - 1360px)/2 + 48px));z-index:40;display:flex;gap:6px;align-items:center}
.desk-tools .ibtn{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}

.bottom-nav,.fab{display:none}

/* ═════════════ COMMON UI ═════════════ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;padding-right:96px}
.page-head h1{font-family:var(--display);font-size:2rem;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.page-head h1 .emo{margin-right:6px}
.page-head p{color:var(--text-2);margin-top:4px}
.crumb{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;color:var(--text-3);text-decoration:none;margin-bottom:8px}
.crumb:hover{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;gap:10px;padding:16px 18px 6px;flex-wrap:wrap}
.card-head h2{font-family:var(--display);font-size:1.12rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-head .spacer{flex:1}
.card-body{padding:6px 18px 18px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--surface-2);color:var(--text-2)}
.pill-urgent{background:var(--urgent-soft);color:var(--urgent)}
.pill-week{background:var(--week-soft);color:var(--week)}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.link-btn{display:inline-flex;align-items:center;gap:5px;font-size:.84rem;font-weight:700;color:var(--accent);text-decoration:none;padding:6px 10px;border-radius:9px;transition:background .15s}
.link-btn:hover{background:var(--accent-soft)}
.link-btn .i{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:11px;font-weight:700;font-size:.9rem;transition:transform .12s,background .15s,box-shadow .2s,border-color .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn .i{width:17px;height:17px}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 14px -8px var(--accent)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-outline{border:1px solid var(--line-strong);background:var(--surface)}
.btn-outline:hover{border-color:var(--text-3)}
.btn-danger{background:var(--urgent-soft);color:var(--urgent)}
.btn-danger:hover{background:var(--urgent);color:#fff}
.btn-week{background:var(--week);color:#fff}
.btn-sm{padding:6px 11px;font-size:.8rem;border-radius:9px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:.78rem;font-weight:800;color:var(--text-2);letter-spacing:.01em}
.input,.field input:not([type=checkbox]):not([type=radio]),.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s;font-size:.93rem}
.input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:9px;font-size:.82rem;font-weight:700;color:var(--text-2);transition:background .15s,color .15s,box-shadow .15s;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.seg button .pd{width:8px;height:8px;border-radius:50%}
.pd-high{background:var(--urgent)} .pd-medium{background:var(--warn)} .pd-low{background:var(--low)} .pd-{background:var(--line-strong)}
.empty{padding:22px 10px;text-align:center;color:var(--text-3);font-size:.88rem}
.empty .big{font-size:1.8rem;display:block;margin-bottom:4px}
.add-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.add-row .input{flex:1;min-width:0}
.searchbox{position:relative;flex:1;min-width:180px;max-width:340px}
.searchbox .i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);width:17px;height:17px}
.searchbox input{padding-left:36px}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;font-size:.88rem}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:40px;height:24px;border-radius:20px;background:var(--surface-3);position:relative;transition:background .2s;flex-shrink:0}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s var(--ease)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

/* ═════════════ TASKS ═════════════ */
.tasks{list-style:none;display:flex;flex-direction:column;gap:2px;min-height:8px}
.tasks:empty::before{content:attr(data-empty);display:block;padding:18px 8px;text-align:center;color:var(--text-3);font-size:.85rem;border:1.5px dashed var(--line);border-radius:12px}
.task{display:flex;align-items:flex-start;gap:6px;padding:9px 8px 9px 4px;border-radius:12px;position:relative;transition:background .15s;background:var(--surface)}
.task:hover{background:var(--surface-2)}
.task::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:transparent}
.task.p-high::before{background:var(--urgent)} .task.p-medium::before{background:var(--warn)} .task.p-low::before{background:var(--low)}
.grip{width:20px;height:26px;display:grid;place-items:center;color:var(--text-3);cursor:grab;opacity:0;transition:opacity .15s;touch-action:none;flex-shrink:0;margin-left:2px}
.grip .i{width:15px;height:15px}
.task:hover .grip{opacity:.8}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);display:grid;place-items:center;flex-shrink:0;margin-top:2px;color:transparent;transition:background .18s,border-color .18s,color .18s,transform .15s}
.check .i{width:14px;height:14px;stroke-width:3}
.check:hover{border-color:var(--ok)}
.check:active{transform:scale(.85)}
.task.is-done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.task.anim .check{animation:pop .35s var(--ease)}
.task.anim-in{animation:slideIn .35s var(--ease)}
.task-body{flex:1;min-width:0;cursor:pointer;padding:1px 2px}
.task-title{font-weight:650;font-size:.93rem;word-break:break-word;transition:color .2s}
.task.is-done .task-title{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-3)}
.task-note{font-size:.82rem;color:var(--text-2);margin-top:2px;word-break:break-word;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.task-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--text-2);background:var(--surface-2);border-radius:7px;padding:2px 7px;text-decoration:none;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.task:hover .chip{background:var(--surface-3)}
.chip .i{width:12px;height:12px;stroke-width:2.2}
a.chip:hover{color:var(--accent);background:var(--accent-soft)!important}
.chip-link{color:var(--low)}
.chip-todo{color:var(--week);background:var(--week-soft)}
.chip-rem.due{color:#fff;background:var(--urgent)!important}
.chip-rem.soon{color:var(--warn);background:var(--warn-soft)}
.chip-prio-high{color:var(--urgent);background:var(--urgent-soft)} .chip-prio-medium{color:var(--warn);background:var(--warn-soft)} .chip-prio-low{color:var(--low);background:var(--low-soft)}
.chip-due.over{color:var(--urgent);background:var(--urgent-soft)}
.inline-link{color:var(--low);font-weight:700;text-decoration:none;word-break:break-all}
.inline-link:hover{text-decoration:underline}
.task-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s;flex-shrink:0;margin-top:-4px}
.task:hover .task-actions,.task:focus-within .task-actions{opacity:1}
.task-actions .ibtn{width:30px;height:30px;border-radius:9px}
.task-actions .ibtn .i{width:16px;height:16px}
.task.flash{animation:flash 1.6s var(--ease)}

/* Sortable states */
.s-ghost{opacity:.35;background:var(--accent-soft)!important}
.s-chosen{box-shadow:var(--shadow-lg);background:var(--surface)!important}
.s-drag{transform:rotate(1.5deg)}
.sortable-fallback{opacity:.95!important}

/* ═════════════ DASHBOARD ═════════════ */
.hero{position:relative;border-radius:var(--r-lg);padding:26px 28px;margin-bottom:22px;overflow:hidden;background:
  radial-gradient(70% 140% at 0% 0%,var(--bg-glow),transparent 60%),radial-gradient(60% 120% at 100% 100%,rgba(91,79,240,.09),transparent 60%),var(--surface);border:1px solid var(--line)}
.hero-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;padding-right:70px}
.hero h1{font-family:var(--display);font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hero .sub{color:var(--text-2);margin-top:6px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-decoration:none;transition:transform .18s var(--ease),box-shadow .2s,border-color .2s;min-width:0}
a.stat:hover,button.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-strong)}
button.stat{text-align:left;width:100%}
.stat .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.stat .ico .i{width:20px;height:20px}
.stat .num{font-family:var(--display);font-size:1.55rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.stat .lbl{font-size:.76rem;font-weight:700;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico-urgent{background:var(--urgent-soft);color:var(--urgent)} .ico-accent{background:var(--accent-soft);color:var(--accent)}
.ico-week{background:var(--week-soft);color:var(--week)} .ico-warn{background:var(--warn-soft);color:var(--warn)}
.ring{width:40px;height:40px;flex-shrink:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--week-soft)} .ring .fg{stroke:var(--week);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;margin-bottom:18px;align-items:start}
.card-urgent{border-color:var(--urgent-line);background:linear-gradient(180deg,var(--urgent-soft),var(--surface) 90px)}
.card-urgent .task{background:transparent}
.card-urgent .task:hover{background:var(--surface-2)}
.agenda-day{padding:10px 0 4px;border-top:1px solid var(--line)}
.agenda-day:first-child{border-top:none;padding-top:2px}
.agenda-head{display:flex;align-items:center;gap:8px;padding:2px 6px 6px;font-weight:800;font-size:.8rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
.agenda-head .d{color:var(--text-3);font-weight:700;text-transform:none;letter-spacing:0}
.agenda-head .cnt{margin-left:auto;font-size:.72rem;color:var(--text-3);text-transform:none;letter-spacing:0}
.agenda-day.today .agenda-head{color:var(--week)}
.agenda-day.past{opacity:.7}
.agenda-day .task{background:transparent}
.agenda-day .task:hover{background:var(--surface-2)}
.agenda-free{font-size:.8rem;color:var(--text-3);padding:0 6px 6px}
.agenda-rest{font-size:.78rem;color:var(--text-3);padding:10px 6px 0;border-top:1px solid var(--line)}

/* Week board */
.week-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.week-nav .range{font-family:var(--display);font-weight:700;font-size:1.02rem;margin-right:6px}
.week-nav input[type=date]{padding:6px 10px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-size:.82rem;outline:none}
.board-wrap{container-type:inline-size}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:thin;overscroll-behavior-x:contain}
@container (min-width:980px){.board{grid-auto-flow:row;grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible}}
.day{scroll-snap-align:start;background:var(--surface-2);border:1px solid transparent;border-radius:16px;padding:10px 8px 8px;display:flex;flex-direction:column;min-height:200px;transition:border-color .2s,background .2s}
.day.today{background:var(--week-soft);border-color:var(--week-line)}
.day.past{opacity:.72}
.day-head{display:flex;align-items:center;gap:6px;padding:0 4px 8px}
.day-head .dn{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.day-head .dd{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.day.today .dd,.day.today .dn{color:var(--week)}
.day-head .meta{margin-left:auto;display:flex;align-items:center;gap:2px}
.day-head .cnt{font-size:.7rem;font-weight:800;color:var(--text-3);padding:2px 6px;border-radius:10px;background:var(--surface)}
.day-head .ibtn{width:26px;height:26px;border-radius:8px}
.day-head .ibtn .i{width:15px;height:15px}
.day .tasks{flex:1;gap:4px}
.day .tasks:empty::before{padding:10px 6px;font-size:.78rem;border-color:var(--line-strong);background:transparent}
.day .task{padding:7px 6px 7px 2px;border-radius:10px;box-shadow:var(--shadow-sm);gap:4px}
.day .task:hover{background:var(--surface)}
.day .task .check{width:19px;height:19px;border-radius:6px;margin-top:1px}
.day .task .check .i{width:12px;height:12px}
.day .task-title{font-size:.84rem;font-weight:600;line-height:1.35}
.day .task-meta{margin-top:4px}
.day .grip{width:16px}
.day .task-actions{position:absolute;right:4px;top:4px;background:var(--surface);border-radius:9px;box-shadow:var(--shadow);margin:0}
.day .task-actions .ibtn{width:26px;height:26px}
.day .task-actions .ibtn .i{width:14px;height:14px}
.day-add{display:flex;gap:4px;margin-top:8px;align-items:center;background:var(--surface);border-radius:10px;padding:3px 3px 3px 4px;border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
.day-add:focus-within{border-color:var(--week);box-shadow:0 0 0 3px var(--week-soft)}
.day-add input{flex:1;min-width:0;border:none;background:transparent;outline:none;padding:6px 4px;font-size:.82rem}
.prio-btn{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
.prio-btn:hover{background:var(--surface-2)}
.prio-btn .pd{width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-strong)}
.prio-btn .pd-high,.prio-btn .pd-medium,.prio-btn .pd-low{box-shadow:none}
.day-add .go{width:28px;height:28px;border-radius:8px;background:var(--week);color:#fff;display:grid;place-items:center;flex-shrink:0}
.day-add .go .i{width:16px;height:16px;stroke-width:2.4}

/* ═════════════ LIST (TAB) VIEW ═════════════ */
.list-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 12px}
.list-tools .spacer{flex:1}
.quick-add{padding:14px}
.quick-add .row{display:flex;gap:8px;align-items:center}
.quick-add .row .input{flex:1}
.quick-more{display:none;margin-top:12px;gap:12px}
.quick-add.open .quick-more{display:grid}
.items .task{padding:12px 10px 12px 4px;border:1px solid var(--line);margin-bottom:6px;box-shadow:var(--shadow-sm)}
.items .task:hover{background:var(--surface);border-color:var(--line-strong)}
.items .task-actions{opacity:1}
.mini-stats{display:flex;gap:6px;flex-wrap:wrap}

/* ═════════════ BOOKMARKS ═════════════ */
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin-bottom:14px}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;font-weight:700;font-size:.86rem;background:var(--surface);border:1px solid var(--line);white-space:nowrap;color:var(--text-2);transition:all .15s;text-decoration:none}
.cat:hover{border-color:var(--line-strong);color:var(--text)}
.cat.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.cat .n{font-size:.72rem;opacity:.7}
.cat-add{border-style:dashed;color:var(--text-3)}
.bm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bm{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:transform .18s var(--ease),box-shadow .2s,border-color .2s;position:relative}
.bm:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.bm-top{display:flex;gap:10px;align-items:center}
.fav{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-size:1.1rem}
.fav img{width:22px;height:22px}
.bm-name{font-weight:750;word-break:break-word;line-height:1.25}
.bm-url{font-size:.76rem;color:var(--text-3);word-break:break-all}
.bm-note{font-size:.82rem;color:var(--text-2);white-space:pre-line}
.bm-actions{display:flex;align-items:center;gap:2px;margin-top:auto}
.bm-actions .spacer{flex:1}
.bm .grip{opacity:.5;position:absolute;top:8px;right:6px}
.bm:hover .grip{opacity:.9}

/* ═════════════ HISTORY ═════════════ */
.hist-week{margin-bottom:12px;overflow:hidden}
.hist-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.hist-head:hover{background:var(--surface-2)}
.hist-head .t{font-family:var(--display);font-weight:700;font-size:1.02rem}
.hist-head .s{font-size:.8rem;color:var(--text-3);font-weight:700}
.bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;width:120px}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:6px}
.hist-head .chev{margin-left:auto;transition:transform .2s;color:var(--text-3)}
.hist-week.open .chev{transform:rotate(90deg)}
.hist-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.hist-week.open .hist-body{display:block}
.hist-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.hist-day{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.hist-day .dn{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.hist-day .dd{font-weight:800;margin-bottom:6px}
.hist-task{display:flex;gap:6px;font-size:.82rem;padding:2px 0;align-items:flex-start}
.hist-task .i{width:14px;height:14px;margin-top:2px}
.hist-task.done{color:var(--text-3)}
.hist-task.done .i{color:var(--ok)}
.hist-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ═════════ NOTES ═════════ */
.nav-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pswitch{display:flex;align-items:center;gap:8px;margin:8px 4px 0;padding:8px 10px;border-radius:12px;background:var(--week-soft);color:var(--week);font-weight:700;font-size:.84rem}
.pswitch select{flex:1;min-width:0;border:none;background:transparent;font-weight:800;color:inherit;outline:none}
.tpl-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.tpl{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--surface);border:1px dashed var(--line-strong);font-size:1.05rem;transition:border-color .15s,transform .15s,background .15s;text-align:left}
.tpl b{font-size:.88rem}
.tpl:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ncard{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;min-height:150px;transition:transform .18s var(--ease),box-shadow .2s,border-color .2s}
.ncard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.ncard-top{display:flex;align-items:center;gap:8px}
.ncard-top b{font-family:var(--display);font-size:1.08rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard-prev{flex:1;display:flex;flex-direction:column;gap:3px;font-size:.84rem;color:var(--text-2);overflow:hidden}
.ncard-prev .pc{display:flex;gap:6px;align-items:center}
.ncard-prev .pc .i{width:14px;height:14px;flex-shrink:0}
.ncard-prev .pc.d{color:var(--text-3);text-decoration:line-through}
.ncard-prev .pc.d .i{color:var(--ok)}
.ncard-prev .ph{font-weight:800;color:var(--text);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.ncard-prev .pp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard-foot{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--text-3);font-weight:700}
.ncard-foot .bar{flex:1;width:auto}
.note-head{align-items:flex-end}
.note-title{width:100%;font-family:var(--display);font-size:2rem;font-weight:700;letter-spacing:-.025em;border:none;background:transparent;outline:none;padding:2px 0;color:var(--text)}
.note-title::placeholder{color:var(--text-3)}
.note-card{padding:10px 10px 14px}
.note-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.note-tools .spacer{flex:1}
.note-prog{display:flex;align-items:center;gap:8px;font-size:.82rem}
.note-prog .bar{width:90px}
.nblocks{display:flex;flex-direction:column}
.nb{display:flex;align-items:flex-start;gap:4px;padding:2px 4px;border-radius:10px;transition:background .15s}
.nb:hover,.nb:focus-within{background:var(--surface-2)}
.nb .grip{height:34px}
.nb:hover .grip{opacity:.7}
.nb-in{flex:1;min-width:0;border:none;background:transparent;outline:none;resize:none;overflow:hidden;font-size:.98rem;line-height:1.5;padding:6px 2px;color:var(--text);min-height:34px}
.nb-h .nb-in{font-family:var(--display);font-weight:700;font-size:1.25rem;padding-top:10px}
.nb-c .nb-in{padding-left:4px}
.ncheck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);display:grid;place-items:center;flex-shrink:0;margin-top:7px;color:transparent;transition:background .18s,border-color .18s,color .18s}
.ncheck .i{width:14px;height:14px;stroke-width:3}
.nb.done .ncheck{background:var(--ok);border-color:var(--ok);color:#fff}
.nb.done .nb-in{color:var(--text-3);text-decoration:line-through}
.nb.pop .ncheck{animation:pop .35s var(--ease)}
.nb-del{opacity:0;width:28px;height:28px;margin-top:3px}
.nb:hover .nb-del,.nb:focus-within .nb-del{opacity:.7}
.nb-add-end{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-top:4px;color:var(--text-3);font-weight:700;font-size:.88rem;border-radius:10px;width:100%}
.nb-add-end:hover{background:var(--surface-2);color:var(--accent)}
.ico-ok{background:var(--ok-soft);color:var(--ok)}
/* ═════════ GOOGLE CALENDAR ═════════ */
.gevs{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.gev{display:flex;gap:6px;align-items:baseline;font-size:.76rem;text-decoration:none;padding:4px 7px;border-radius:8px;background:var(--low-soft);color:var(--text);border-left:3px solid var(--low);overflow:hidden}
.gev:hover{filter:brightness(.97)}
.gev .gt{font-weight:800;color:var(--low);white-space:nowrap;font-size:.7rem}
.gev .gs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.agenda-day .gevs{padding:0 6px 4px}
.chip-gcal{color:var(--low);background:var(--low-soft)}
.gcal-box{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;flex-wrap:wrap}
.gcal-box > .i{color:var(--low)}
.gcal-box b{display:block;font-size:.88rem}
.gcal-box small{color:var(--text-3);font-size:.76rem}
/* ═════════ SETTINGS ═════════ */
details.set{border:1px solid var(--line);border-radius:14px;overflow:hidden;flex-shrink:0}
details.set > summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
details.set > summary::-webkit-details-marker{display:none}
details.set > summary b{flex:1}
details.set[open] > summary{border-bottom:1px solid var(--line);background:var(--surface-2)}
.set-body{padding:14px;display:flex;flex-direction:column;gap:12px}
details.howto{font-size:.84rem;color:var(--text-2)}
details.howto summary{cursor:pointer;font-weight:700;color:var(--accent)}
details.howto ol{padding-left:20px;margin-top:8px;display:flex;flex-direction:column;gap:6px}
details.howto a{color:var(--low);font-weight:700}
details.howto code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:.8rem}
.share-list{display:flex;flex-direction:column;gap:6px}
.share-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:.88rem}
.share-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sec-list{display:flex;flex-direction:column;gap:6px}
.sec-item{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);align-items:flex-start}
.sec-item b{display:block;font-size:.86rem}
.sec-item small{display:block;color:var(--text-2);font-size:.78rem;margin-top:2px}
.sec-item.fail{background:var(--urgent-soft)}
.sec-item.warn{background:var(--warn-soft)}
@media (max-width:900px){.tpl-row{grid-template-columns:1fr 1fr}}
@media (hover:none){.nb-del{opacity:.55}.nb .grip{opacity:.5}}
@media (max-width:640px){.note-title{font-size:1.6rem}.nb-in{font-size:16px}}

/* ═════════════ SHEET / MODAL ═════════════ */
.sheet-bg{position:fixed;inset:0;z-index:500;background:rgba(15,12,8,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:min(88vh,820px);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateY(12px) scale(.98);transition:transform .28s var(--ease);overflow:hidden}
.sheet-bg.open .sheet{transform:none}
.sheet.side{max-width:440px}
.sheet-head{display:flex;align-items:center;gap:10px;padding:18px 20px 10px}
.sheet-head h3{font-family:var(--display);font-size:1.3rem;font-weight:700;letter-spacing:-.02em;flex:1}
.sheet-body{padding:6px 20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-foot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.sheet-foot .spacer{flex:1}
.handle{display:none}
.choice{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;text-align:left;transition:border-color .15s,background .15s;width:100%}
.choice:hover{border-color:var(--line-strong);background:var(--surface-2)}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.choice b{display:block;font-size:.92rem}
.choice small{color:var(--text-3);font-size:.78rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rem-box{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.rem-box .when{display:none}
.rem-box.on .when{display:flex;gap:8px;flex-wrap:wrap}
.rem-box .when input{flex:1;min-width:180px}
.notif{display:flex;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line);align-items:flex-start}
.notif.due{border-color:var(--urgent-line);background:var(--urgent-soft)}
.notif .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.notif .tx{flex:1;min-width:0}
.notif .tx b{display:block;word-break:break-word}
.notif .tx small{color:var(--text-3);font-weight:700;font-size:.76rem}
.notif .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sec-title{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.sheet-list a,.sheet-list button.row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;text-decoration:none;font-weight:700;width:100%}
.sheet-list a:hover,.sheet-list button.row:hover{background:var(--surface-2)}
.sheet-list .emo{width:26px;text-align:center;font-size:1.15rem}
.sheet-list .count{margin-left:auto;color:var(--text-3);font-size:.8rem}

/* ═════════════ TOASTS ═════════════ */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:#1d1b18;color:#f6f2ea;padding:11px 12px 11px 16px;border-radius:14px;box-shadow:var(--shadow-lg);font-weight:650;font-size:.88rem;animation:toastIn .32s var(--ease);max-width:100%}
:root[data-theme="dark"] .toast{background:#f3efe7;color:#1b1a17}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:#f3efe7;color:#1b1a17}}
.toast.out{animation:toastOut .25s var(--ease) forwards}
.toast span{flex:1}
.toast button{font-weight:800;color:var(--accent);padding:5px 9px;border-radius:8px}
.toast button:hover{background:rgba(255,255,255,.1)}

/* ═════════════ ANIMATIONS ═════════════ */
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--accent);background:var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ═════════════ TOUCH ═════════════ */
@media (hover:none){
  .grip{opacity:.55}
  .task-actions{opacity:1}
  .day .task-actions{display:none}
  .nav-item .nav-edit{opacity:1}
}

/* ═════════════ RESPONSIVE ═════════════ */
@media (max-width:1180px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-grid{grid-template-columns:1fr}
}
@media (max-width:1023px){
  .sidebar,.desk-tools{display:none}
  .main{margin-left:0;padding-bottom:calc(76px + var(--safe-b))}
  .topbar{display:flex;position:sticky;top:0;z-index:60;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;flex:1}
  .topbar .brand b{font-size:1.15rem}
  .topbar .sync{padding:5px 8px}
  .topbar .sync .txt{display:none}
  .view{padding:18px 16px 40px}
  .page-head{padding-right:0}
  .hero-top{padding-right:0}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
  .bottom-nav a,.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:.68rem;font-weight:800;color:var(--text-3);text-decoration:none;position:relative}
  .bottom-nav .i{width:22px;height:22px}
  .bottom-nav .on{color:var(--accent)}
  .bottom-nav .badge-dot{top:0;right:calc(50% - 22px)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(84px + var(--safe-b));z-index:71;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:0 14px 28px -10px var(--accent),var(--shadow);transition:transform .15s}
  .fab:active{transform:scale(.92)}
  .fab .i{width:26px;height:26px;stroke-width:2.4}
  #toasts{bottom:calc(150px + var(--safe-b))}
}
@media (max-width:640px){
  body{font-size:15px}
  .input,.field input:not([type=checkbox]),.field textarea,.field select,.day-add input,.week-nav input[type=date]{font-size:16px}
  .hero{padding:20px 18px;border-radius:18px}
  .stats{gap:8px;margin-top:16px}
  .stat{padding:12px;gap:10px;border-radius:14px}
  .stat .ico,.ring{width:34px;height:34px}
  .stat .num{font-size:1.3rem}
  .page-head h1{font-size:1.6rem}
  .grid2{grid-template-columns:1fr}
  .choices{grid-template-columns:1fr}
  .card-head{padding:14px 14px 4px}
  .card-body{padding:4px 12px 14px}
  .board{grid-auto-flow:row;grid-template-columns:1fr;overflow:visible;scroll-snap-type:none}
  .day{min-height:0}
  .day.past.collapsed .tasks,.day.past.collapsed .day-add{display:none}
  .week-nav .range{width:100%}
  .sheet-bg{align-items:flex-end;padding:0}
  .sheet{max-width:none!important;border-radius:22px 22px 0 0;max-height:92vh;transform:translateY(100%)}
  .sheet-bg.open .sheet{transform:none}
  .handle{display:block;width:40px;height:5px;border-radius:5px;background:var(--line-strong);margin:8px auto 0}
  .sheet-head{padding-top:10px}
  .sheet-foot{padding-bottom:calc(14px + var(--safe-b))}
  .sheet-foot .btn{flex:1}
  .sheet-foot .spacer{display:none}
  .items .task{padding:11px 8px 11px 2px}
  .items .task-actions .ibtn{width:32px;height:32px}
  .list-tools .searchbox{max-width:none;min-width:100%}
  .task-title{font-size:.95rem}
}
</style>
</head>
